name: college-counselor-saas

x-logging: &production-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  app:
    build:
      context: .
      args:
        FRONTEND_BUILD: build:saas
    image: college-counselor-saas:local
    command:
      - node
      - start-saas.mjs
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      NODE_ENV: production
      WEB_DEPLOYMENT: "1"
      SAAS_DEPLOYMENT: "1"
      HOST: 0.0.0.0
      PORT: "3001"
      DATA_DIR: /var/lib/college-counselor
      SIM_DATA_DIR: /tmp/simulations
      HOME: /tmp
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      TRUST_PROXY: "1"
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env.saas}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env.saas}
      INVITE_BASE_URL: ${INVITE_BASE_URL:?Set INVITE_BASE_URL in .env.saas}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env.saas}
      SIM_INTERNAL_TOKEN: ${SIM_INTERNAL_TOKEN:?Set SIM_INTERNAL_TOKEN in .env.saas}
      STUDENT_STORAGE_SALT: ${STUDENT_STORAGE_SALT:?Set STUDENT_STORAGE_SALT in .env.saas}
      SAAS_EMAIL_PEPPER: ${SAAS_EMAIL_PEPPER:?Set SAAS_EMAIL_PEPPER in .env.saas}
      SAAS_PROVISIONING_TOKEN: ${SAAS_PROVISIONING_TOKEN:?Set SAAS_PROVISIONING_TOKEN in .env.saas}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env.saas}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env.saas}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env.saas}
      SCORECARD_API_KEY: ${SCORECARD_API_KEY:-}
      RETENTION_MODE: ${RETENTION_MODE:-institutional}
      SAAS_GUARDIAN_CONSENT_REQUIRED: ${SAAS_GUARDIAN_CONSENT_REQUIRED:-1}
      SAAS_POLICY_VERSION: ${SAAS_POLICY_VERSION:-2026.1}
      SAAS_INVITE_TTL_HOURS: ${SAAS_INVITE_TTL_HOURS:-72}
      SAAS_SESSION_IDLE_MINUTES: ${SAAS_SESSION_IDLE_MINUTES:-15}
      SAAS_SESSION_ABSOLUTE_HOURS: ${SAAS_SESSION_ABSOLUTE_HOURS:-168}
      SAAS_PASSWORD_RESET_TTL_MINUTES: ${SAAS_PASSWORD_RESET_TTL_MINUTES:-30}
      SAAS_STUDENT_UPLOAD_QUOTA_MB: ${SAAS_STUDENT_UPLOAD_QUOTA_MB:-100}
      SAAS_TENANT_UPLOAD_QUOTA_MB: ${SAAS_TENANT_UPLOAD_QUOTA_MB:-2048}
      SAAS_MIN_FREE_STORAGE_MB: ${SAAS_MIN_FREE_STORAGE_MB:-512}
      CDS_DAILY_REFRESH: ${CDS_DAILY_REFRESH:-0}
      AUTO_REFRESH_CDS: ${AUTO_REFRESH_CDS:-0}
      ENABLE_DOMAIN_MONITOR: ${ENABLE_DOMAIN_MONITOR:-0}
      TESSERACT_CACHE_PATH: /tmp/tesseract
    expose:
      - "3001"
    volumes:
      - counselor-data:/var/lib/college-counselor
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    read_only: true
    networks:
      - application
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/api/ready').then(r => {
            if (!r.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging: *production-logging
    <<: *service-security

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env.saas}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.saas:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    read_only: true
    networks:
      - application
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    logging: *production-logging
    cap_add:
      - NET_BIND_SERVICE
    <<: *service-security

  # Optional: `--profile backup` continuously replicates the three SQLite
  # databases. Attachments still require encrypted volume/object snapshots.
  litestream:
    image: litestream/litestream:0.5.14-scratch
    profiles:
      - backup
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    depends_on:
      app:
        condition: service_healthy
    user: "1000:1000"
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_S3_BUCKET: ${LITESTREAM_S3_BUCKET:-}
      LITESTREAM_S3_REGION: ${LITESTREAM_S3_REGION:-us-east-1}
      LITESTREAM_S3_ENDPOINT: ${LITESTREAM_S3_ENDPOINT:-}
      LITESTREAM_S3_PREFIX: ${LITESTREAM_S3_PREFIX:-college-counselor/production}
      LITESTREAM_SSE_KMS_KEY_ID: ${LITESTREAM_SSE_KMS_KEY_ID:-}
      LITESTREAM_HEARTBEAT_URL: ${LITESTREAM_HEARTBEAT_URL:-}
    command:
      - replicate
      - -config
      - /etc/litestream.yml
    configs:
      - source: litestream
        target: /etc/litestream.yml
        mode: 0444
    volumes:
      - counselor-data:/var/lib/college-counselor
    read_only: true
    networks:
      - application
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging: *production-logging
    <<: *service-security

configs:
  litestream:
    content: |
      logging:
        level: info
        type: json
      retention:
        enabled: false
      snapshot:
        interval: 24h
        retention: 720h
      levels:
        - interval: 5m
        - interval: 1h
        - interval: 24h
      validation:
        interval: 6h
      verify-compaction: true
      heartbeat-url: "$${LITESTREAM_HEARTBEAT_URL}"
      heartbeat-interval: 5m
      shutdown-sync-timeout: 30s
      shutdown-sync-interval: 500ms
      dbs:
        - path: /var/lib/college-counselor/counselor.db
          replica:
            type: s3
            bucket: "$${LITESTREAM_S3_BUCKET}"
            path: "$${LITESTREAM_S3_PREFIX}/counselor"
            region: "$${LITESTREAM_S3_REGION}"
            endpoint: "$${LITESTREAM_S3_ENDPOINT}"
            sse-kms-key-id: "$${LITESTREAM_SSE_KMS_KEY_ID}"
            sync-interval: 10s
        - path: /var/lib/college-counselor/pii-vault.db
          replica:
            type: s3
            bucket: "$${LITESTREAM_S3_BUCKET}"
            path: "$${LITESTREAM_S3_PREFIX}/pii-vault"
            region: "$${LITESTREAM_S3_REGION}"
            endpoint: "$${LITESTREAM_S3_ENDPOINT}"
            sse-kms-key-id: "$${LITESTREAM_SSE_KMS_KEY_ID}"
            sync-interval: 10s
        - path: /var/lib/college-counselor/vectors.db
          replica:
            type: s3
            bucket: "$${LITESTREAM_S3_BUCKET}"
            path: "$${LITESTREAM_S3_PREFIX}/vectors"
            region: "$${LITESTREAM_S3_REGION}"
            endpoint: "$${LITESTREAM_S3_ENDPOINT}"
            sse-kms-key-id: "$${LITESTREAM_SSE_KMS_KEY_ID}"
            sync-interval: 10s

volumes:
  counselor-data:
  caddy-data:
  caddy-config:

networks:
  application:
